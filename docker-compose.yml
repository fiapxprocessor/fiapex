version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - .:/app 
      - shared_storage:/app/uploads
    depends_on:
      - postgres
      - storage

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiapx_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  storage:
    image: alpine
    command: /bin/sh -c "mkdir -p /mnt/storage/videos /mnt/storage/frames /mnt/storage/zips && tail -f /dev/null"
    volumes:
      - shared_storage:/mnt/storage
    restart: always

volumes:
  pgdata:
  shared_storage:
